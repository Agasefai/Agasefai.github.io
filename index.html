<!DOCTYPE html>
<html lang="az">
<head>
    <meta charset="UTF-8">
    <title>Ağasəf Aİ - Biznes</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #0f172a; color: #fff; text-align: center; padding-top: 100px; margin: 0; }
        .box { background: #1e293b; padding: 30px; border-radius: 10px; display: inline-block; width: 300px; box-shadow: 0 4px 10px rgba(0,0,0,0.3); }
        input { width: 90%; padding: 10px; margin: 10px 0; border-radius: 5px; border: none; }
        button { background: #38bdf8; color: #000; font-weight: bold; padding: 10px 20px; border: none; border-radius: 5px; cursor: pointer; width: 100%; }
        button:hover { background: #0ea5e9; }
        .hidden { display: none; }
        .logout-btn { background: #ef4444; color: #fff; margin-top: 10px; }
    </style>
</head>
<body>

    <!-- GİRİŞ VƏ QEYDİYYAT HİSSƏSİ -->
    <div id="auth-container" class="box">
        <h2 id="form-title">Qeydiyyat</h2>
        <input type="text" id="username" placeholder="İstifadəçi adı">
        <input type="password" id="password" placeholder="Şifrə">
        <button id="action-btn" onclick="qeydiyyatVəYaGiriş()">Qeydiyyatdan Keç</button>
        <p id="toggle-text" style="font-size: 14px; cursor: pointer; color: #38bdf8; margin-top: 15px;" onclick="formuDəyiş()">Hesabın var? Daxil ol</p>
    </div>

    <!-- İSTİFADƏÇİ DAXİL OLANDAN SONRA GÖRÜNƏCƏK HİSSƏ -->
    <p id="welcome-msg" class="hidden" style="font-size: 24px; color: #22c55e;"></p>
    <button id="logout-btn" class="hidden logout-btn" onclick="çıxışEt()">Çıxış Et</button>

    <script>
        let qeydiyyatRejimi = true;

        // Sayt açılanda yoxla görən əvvəldən daxil olub ya yox
        window.onload = function() {
            let aktivUser = localStorage.getItem("aktivIstifadeci");
            if (aktivUser) {
                girisEkraniGoster(aktivUser);
            }
        }

        function formuDəyiş() {
            qeydiyyatRejimi = !qeydiyyatRejimi;
            document.getElementById("form-title").innerText = qeydiyyatRejimi ? "Qeydiyyat" : "Giriş Et";
            document.getElementById("action-btn").innerText = qeydiyyatRejimi ? "Qeydiyyatdan Keç" : "Daxil Ol";
            document.getElementById("toggle-text").innerText = qeydiyyatRejimi ? "Hesabın var? Daxil ol" : "Hesabın yoxdur? Qeydiyyatdan keç";
        }

        function qeydiyyatVəYaGiriş() {
            let user = document.getElementById("username").value.trim();
            let pass = document.getElementById("password").value.trim();

            if (!user || !pass) {
                alert("Zəhmət olmasa bütün xanaları doldurun!");
                return;
            }

            if (qeydiyyatRejimi) {
                // Qeydiyyat
                localStorage.setItem("user_" + user, pass);
                alert("Uğurla qeydiyyatdan keçdiniz! İndi daxil ola bilərsiniz.");
                formuDəyiş();
            } else {
                // Giriş
                let saxlanilanSifre = localStorage.getItem("user_" + user);
                if (saxlanilanSifre === pass) {
                    localStorage.setItem("aktivIstifadeci", user);
                    girisEkraniGoster(user);
                } else {
                    alert("İstifadəçi adı və ya şifrə səhvdir!");
                }
            }
        }

        function girisEkraniGoster(user) {
            document.getElementById("auth-container").classList.add("hidden");
            let msg = document.getElementById("welcome-msg");
            msg.innerText = "Xoş gəldin, " + user + "!";
            msg.classList.remove("hidden");
            document.getElementById("logout-btn").classList.remove("hidden");
        }

        function çıxışEt() {
            localStorage.removeItem("aktivIstifadeci");
            location.reload();
        }
    </script>

</body>
</html>
