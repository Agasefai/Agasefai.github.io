<!DOCTYPE html>
<html lang="az">
<head>
    <meta charset="UTF-8">
    <title>Ağasəf Aİ - Biznes</title>
    <!-- Netlify Identity Vidceti -->
    <script type="text/javascript" src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>
    <style>
        body { font-family: Arial, sans-serif; background-color: #0f172a; color: #fff; text-align: center; margin: 0; padding: 50px; }
        h1 { color: #38bdf8; }
        .giris-qutu { margin-top: 30px; }
        /* Netlify düyməsinin dizaynı */
        [data-netlify-identity-menu] { display: inline-block; }
    </style>
</head>
<body>

    <h1>Ağasəf Aİ Biznes Portalı</h1>
    <p>Xidmətlərimizdən yararlanmaq üçün hesabınıza daxil olun:</p>

    <!-- Giriş və Qeydiyyat Düyməsi -->
    <div class="giris-qutu">
        <div data-netlify-identity-menu></div>
    </div>

    <script>
      if (window.netlifyIdentity) {
        window.netlifyIdentity.on("init", user => {
          if (!user) {
            window.netlifyIdentity.on("login", () => {
              document.location.reload();
            });
          }
        });
      }
    </script>
</body>
</html>
