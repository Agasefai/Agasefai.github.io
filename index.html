<!DOCTYPE html>
<html lang="az">
<head>
    <meta charset="UTF-8">
    <!-- Mobil cihazlarda belə avtomatik masaüstü rejimdə açılması üçün: -->
    <meta name="viewport" content="width=1024">
    <title>404 - Baxım Molası</title>
    <style>
        :root {
            --bg-color: #ffffff;
            --text-color: #111111;
            --muted-color: #666666;
            --border-color: #e5e5e5;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            justify-content: space-between;
            align-items: center;
            text-align: center;
        }

        .container {
            max-width: 600px;
            padding: 40px 20px;
            margin: auto;
        }

        /* Başlıq və 3D Koalanı yan-yana və mərkəzdə saxlamaq üçün */
        .error-header {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 20px;
            margin-bottom: 20px;
        }

        h1 {
            font-size: 72px;
            font-weight: 800;
            margin: 0;
            letter-spacing: -2px;
        }

        /* 3D Discord Koala Stili (Kölgə və dərinlik effekti ilə) */
        .discord-koala-3d {
            width: 75px;
            height: 75px;
            background: linear-gradient(135deg, #5865F2, #404eed);
            border-radius: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            /* 3D qabarıqlıq və kölgə effekti */
            box-shadow: 0 12px 25px rgba(88, 101, 242, 0.4), 
                        inset 0 4px 6px rgba(255, 255, 255, 0.3), 
                        inset 0 -4px 6px rgba(0, 0, 0, 0.2);
            transform: perspective(500px) rotateY(-8deg) rotateX(5deg);
            transition: transform 0.3s ease;
        }

        .discord-koala-3d:hover {
            transform: perspective(500px) rotateY(0deg) rotateX(0deg) scale(1.05);
        }

        /* Koala simvolu (və ya şrift/ikon) */
        .discord-koala-3d svg {
            width: 42px;
            height: 42px;
            fill: #ffffff;
            filter: drop-shadow(0 2px 4px rgba(0,0,0,0.2));
        }

        p {
            font-size: 18px;
            line-height: 1.6;
            color: var(--muted-color);
            margin-bottom: 40px;
        }

        .moderator-card {
            display: inline-flex;
            align-items: center;
            gap: 12px;
            padding: 12px 24px;
            background: #fafafa;
            border: 1px solid var(--border-color);
            border-radius: 50px;
            margin-top: 20px;
        }

        .moderator-avatar {
            width: 40px;
            height: 40px;
            background-color: #d1d5db;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 600;
            color: #374151;
            font-size: 16px;
        }

        .moderator-info {
            text-align: left;
        }

        .moderator-label {
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: var(--muted-color);
            display: block;
        }

        .moderator-name {
            font-size: 15px;
            font-weight: 600;
            color: var(--text-color);
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .verified-badge {
            color: #1d9bf0;
            display: inline-flex;
            align-items: center;
        }

        .verified-badge svg {
            width: 16px;
            height: 16px;
            fill: currentColor;
        }

        .footer {
            padding: 20px;
            width: 100%;
            display: flex;
            justify-content: center;
        }

        #google_translate_element {
            margin-top: 10px;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Başlıq və 3D Discord Koala Yan-yana -->
        <div class="error-header">
            <!-- 3D Discord Koala İkonu -->
            <div class="discord-koala-3d" title="Discord Koala">
                <svg viewBox="0 0 24 24">
                    <path d="M20.317 4.37a19.791 19.791 0 0 0-4.885-1.515.074.074 0 0 0-.079.037c-.21.375-.444.864-.608 1.25a18.27 18.27 0 0 0-5.487 0 12.64 12.64 0 0 0-.617-1.25.077.077 0 0 0-.079-.037A19.736 19.736 0 0 0 3.677 4.37a.07.07 0 0 0-.032.027C.533 9.046-.32 13.58.099 18.057a.082.082 0 0 0 .031.057 19.9 19.9 0 0 0 5.993 3.03.078.078 0 0 0 .084-.028c.462-.63.874-1.295 1.226-1.994.021-.041.001-.09-.041-.106a13.107 13.107 0 0 1-1.872-.892.077.077 0 0 1-.008-.128 10.2 10.2 0 0 0 .372-.292.074.074 0 0 1 .077-.01c3.927 1.793 8.18 1.793 12.061 0a.074.074 0 0 1 .078.01c.12.098.246.198.373.292a.077.077 0 0 1-.006.127 12.299 12.299 0 0 1-1.873.892.077.077 0 0 0-.041.107c.36.698.772 1.362 1.225 1.993a.076.076 0 0 0 .084.028 19.839 19.839 0 0 0 6.002-3.03.077.077 0 0 0 .032-.054c.5-5.177-.838-9.674-3.549-13.66a.061.061 0 0 0-.031-.028zM8.02 15.33c-1.183 0-2.157-1.085-2.157-2.419 0-1.333.956-2.419 2.157-2.419 1.21 0 2.176 1.096 2.157 2.42 0 1.333-.956 2.418-2.157 2.418zm7.975 0c-1.183 0-2.157-1.085-2.157-2.419 0-1.333.955-2.419 2.157-2.419 1.21 0 2.176 1.096 2.157 2.42 0 1.333-.946 2.418-2.157 2.418z"/>
                </svg>
            </div>
            <h1>404 ERROR</h1>
        </div>
        
        <!-- Açıqlama -->
        <p>Hay aksi! Maalesef bu site bir moderatör tarafından inceleniliyor.. bakım molası 15 - 1 saat içerisinde sona erecektir.</p>

        <!-- Moderator Kartı -->
        <div class="moderator-card">
            <div class="moderator-avatar">HB</div>
            <div class="moderator-info">
                <span class="moderator-label">SİTEYİ İNCELEYEN MODERATÖR</span>
                <span class="moderator-name">
                    Huseyn Bağırov
                    <span class="verified-badge" title="Təsdiqlənmiş hesab">
                        <svg viewBox="0 0 24 24"><path d="M9 16.17L4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41L9 16.17z"/></svg>
                    </span>
                </span>
            </div>
        </div>
    </div>

    <!-- Google Translate Bölməsi -->
    <div class="footer">
        <div id="google_translate_element"></div>
    </div>

    <!-- Google Translate Script -->
    <script type="text/javascript">
        function googleTranslateElementInit() {
            new google.translate.TranslateElement({pageLanguage: 'tr', layout: google.translate.TranslateElement.InlineLayout.SIMPLE}, 'google_translate_element');
        }
    </script>
    <script type="text/javascript" src="//translate.google.com/translate_a/element.js?cb=googleTranslateElementInit"></script>

</body>
</html>
