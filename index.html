<!DOCTYPE html>
<html lang="az">
<head>
    <meta charset="UTF-8">
    <!-- Mobil cihazlarda belə masaüstü rejimdə (1024px genişlikdə) açılması üçün: -->
    <meta name="viewport" content="width=1024">
    <title>404 - Səhifə Tapılmadı</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #f8fafc;
            color: #0f172a;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            text-align: center;
        }
        .container {
            max-width: 500px;
            padding: 20px;
        }
        h1 {
            font-size: 100px;
            margin: 0;
            color: #0284c7;
            font-weight: bold;
        }
        h2 {
            font-size: 24px;
            margin: 10px 0 10px;
        }
        p {
            color: #64748b;
            margin-bottom: 25px;
            font-size: 16px;
        }
        .moderator {
            font-size: 14px;
            color: #94a3b8;
            margin-bottom: 30px;
            font-style: italic;
        }
        a {
            display: inline-block;
            background-color: #0284c7;
            color: #ffffff;
            padding: 12px 24px;
            border-radius: 8px;
            text-decoration: none;
            font-weight: 600;
            transition: background-color 0.2s;
        }
        a:hover {
            background-color: #0369a1;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>404</h1>
        <h2>Axtardığın səhifə tapılmadı</h2>
        <p>Görünür, daxil etdiyin ünvan səhvdir və ya bu səhifə artıq mövcud deyil.</p>
        <div class="moderator">Moderator: Huseyn Bağırov</div>
