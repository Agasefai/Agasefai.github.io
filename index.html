<!DOCTYPE html>
<html lang="az">
<head>
    <meta charset="UTF-8">
    <title>Giriş</title>
</head>
<body>
    <script>
        let sifre = prompt("Zəhmət olmasa şifrəni daxil edin:");
        if (sifre !== "12345") { // Öz şifrənizi bura yazın
            document.body.innerHTML = "<h2>Giriş qadağandır! Şifrə səhvdir.</h2>";
        }
    </script>
    <h1>Xoş gəlmisiniz! Səhifə uğurla açıldı.</h1>
</body>
</html>
